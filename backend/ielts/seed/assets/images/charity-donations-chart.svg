<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <text x="340" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Percentage of adults who donated money to charity, by age group</text>

  <!-- Axes & grid: y from 0% (y=370) to 80% (y=70), 3.75px per % -->
  <g stroke="#e3e3e3">
    <line x1="80" y1="70" x2="640" y2="70"/><line x1="80" y1="145" x2="640" y2="145"/>
    <line x1="80" y1="220" x2="640" y2="220"/><line x1="80" y1="295" x2="640" y2="295"/>
  </g>
  <line x1="80" y1="370" x2="640" y2="370" stroke="#555"/>
  <line x1="80" y1="60" x2="80" y2="370" stroke="#555"/>
  <g font-size="12" fill="#444" text-anchor="end">
    <text x="72" y="374">0%</text><text x="72" y="299">20%</text><text x="72" y="224">40%</text>
    <text x="72" y="149">60%</text><text x="72" y="74">80%</text>
  </g>

  <!-- Bars: 5 groups, group width 112; bar width 34 -->
  <g>
    <rect x="113" y="227.5" width="34" height="142.5" fill="#4f81bd"/><rect x="149" y="201.25" width="34" height="168.75" fill="#c0504d"/>
    <rect x="225" y="175" width="34" height="195" fill="#4f81bd"/><rect x="261" y="186.25" width="34" height="183.75" fill="#c0504d"/>
    <rect x="337" y="141.25" width="34" height="228.75" fill="#4f81bd"/><rect x="373" y="163.75" width="34" height="206.25" fill="#c0504d"/>
    <rect x="449" y="115" width="34" height="255" fill="#4f81bd"/><rect x="485" y="133.75" width="34" height="236.25" fill="#c0504d"/>
    <rect x="561" y="100" width="34" height="270" fill="#4f81bd"/><rect x="597" y="92.5" width="34" height="277.5" fill="#c0504d"/>
  </g>
  <g font-size="11" fill="#222" text-anchor="middle">
    <text x="130" y="222">38</text><text x="166" y="196">45</text>
    <text x="242" y="170">52</text><text x="278" y="181">49</text>
    <text x="354" y="136">61</text><text x="390" y="158">55</text>
    <text x="466" y="110">68</text><text x="502" y="128">63</text>
    <text x="578" y="95">72</text><text x="614" y="87">74</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="148" y="392">18–24</text><text x="260" y="392">25–34</text><text x="372" y="392">35–49</text>
    <text x="484" y="392">50–64</text><text x="596" y="392">65+</text>
  </g>
  <text x="360" y="416" font-size="13" text-anchor="middle" fill="#444">Age group</text>

  <!-- Legend -->
  <g font-size="13" fill="#333">
    <rect x="260" y="424" width="14" height="12" fill="#4f81bd"/><text x="280" y="435">2004</text>
    <rect x="340" y="424" width="14" height="12" fill="#c0504d"/><text x="360" y="435">2024</text>
  </g>
</svg>
