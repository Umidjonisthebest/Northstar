<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="440" fill="#ffffff"/>
  <text x="340" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Average number of books read per person per year, by age group</text>

  <!-- Axes & grid: y from 0 (y=370) to 20 books (y=70), 15px per book -->
  <g stroke="#e3e3e3">
    <line x1="80" y1="70" x2="640" y2="70"/><line x1="80" y1="145" x2="640" y2="145"/>
    <line x1="80" y1="220" x2="640" y2="220"/><line x1="80" y1="295" x2="640" y2="295"/>
  </g>
  <line x1="80" y1="370" x2="640" y2="370" stroke="#555"/>
  <line x1="80" y1="60" x2="80" y2="370" stroke="#555"/>
  <g font-size="12" fill="#444" text-anchor="end">
    <text x="72" y="374">0</text><text x="72" y="299">5</text><text x="72" y="224">10</text>
    <text x="72" y="149">15</text><text x="72" y="74">20</text>
  </g>
  <text x="26" y="220" font-size="13" fill="#444" text-anchor="middle" transform="rotate(-90 26 220)">Books per year</text>

  <!-- Bars: 4 groups of width 140; bar width 40 -->
  <g>
    <rect x="108" y="235" width="40" height="135" fill="#4f81bd"/><rect x="152" y="280" width="40" height="90" fill="#c0504d"/>
    <rect x="248" y="205" width="40" height="165" fill="#4f81bd"/><rect x="292" y="250" width="40" height="120" fill="#c0504d"/>
    <rect x="388" y="190" width="40" height="180" fill="#4f81bd"/><rect x="432" y="175" width="40" height="195" fill="#c0504d"/>
    <rect x="528" y="160" width="40" height="210" fill="#4f81bd"/><rect x="572" y="85" width="40" height="285" fill="#c0504d"/>
  </g>
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="128" y="229">9</text><text x="172" y="274">6</text>
    <text x="268" y="199">11</text><text x="312" y="244">8</text>
    <text x="408" y="184">12</text><text x="452" y="169">13</text>
    <text x="548" y="154">14</text><text x="592" y="79">19</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="150" y="392">16–24</text><text x="290" y="392">25–39</text><text x="430" y="392">40–59</text><text x="570" y="392">60+</text>
  </g>
  <text x="360" y="414" font-size="13" text-anchor="middle" fill="#444">Age group</text>

  <!-- Legend -->
  <g font-size="13" fill="#333">
    <rect x="260" y="422" width="14" height="12" fill="#4f81bd"/><text x="280" y="433">2005</text>
    <rect x="340" y="422" width="14" height="12" fill="#c0504d"/><text x="360" y="433">2025</text>
  </g>
</svg>
